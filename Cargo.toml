[package]
name = "oxium"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Graphics / window / input
wgpu = "23"
winit = "0.30"
pollster = "0.4"           # block_on adapter init

# Math
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.18", features = ["derive"] }

# ECS
hecs = "0.10"

# Threading / channels
rayon = "1.10"
crossbeam-channel = "0.5"

# Noise
noise = "0.9"

# Serialization / compression
serde = { version = "1", features = ["derive"] }
bincode = { version = "1.3" }     # 1.x for stable wire format
zstd = "0.13"
toml = "0.8"

# Bit packing
bitvec = "1"

# Errors / logging
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

# Image I/O — used by the hidden --screenshot-and-exit path for headless visual verification.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Same code-gen as release, but with full debug info so profilers
# (samply, instruments, cargo-flamegraph) can resolve sampled stacks
# to function names. Build with `cargo build --profile profiling`
# and run with `cargo run --profile profiling -- …` for any session
# you intend to record. Keeping this separate from `release` means
# normal builds don't pay the disk-size cost of the `.dSYM`.
[profile.profiling]
inherits = "release"
debug = "full"
split-debuginfo = "packed"

[profile.dev]
opt-level = 1   # debug builds are slow without this for graphics work
